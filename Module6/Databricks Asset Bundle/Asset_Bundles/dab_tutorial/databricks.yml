# This is a Declarative Automation Bundle definition for dab_tutorial.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_tutorial
  uuid: 68f57b4b-6c5c-47ac-a914-7b4aed93ad52

include:
  - resources/*.yml
  - resources/*/*.yml        # any subdirectory of resources is also included

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-ff77887e-59a5.cloud.databricks.com
    variables:
      catalog: dab_catalog
      schema: dev

  prod:
    mode: production
    workspace:
      host: https://dbc-ff77887e-59a5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/minhdung38109141@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/minhdung38109141@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dab_catalog
      schema: prod
    permissions:
      - user_name: minhdung38109141@gmail.com
        level: CAN_MANAGE
